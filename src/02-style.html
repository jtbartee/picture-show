<style>
/* ============================================================
   PICTURE SHOW — a repertory cinema for the Internet Archive
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#070506;           --ink2:#120c10;
  --velvet:#7a1222;        --velvet-d:#3d0710;   --velvet-l:#a8202f;
  --gold:#c9a227;          --gold-l:#edd07a;     --gold-d:#7d6417;
  --cream:#f4ece0;         --cream-dim:#bfb2a3;
  --screen:#d9d4c8;
  --panel:rgba(14,9,12,.93);
  --focus:#ffd75e;
  --curtain-ease:cubic-bezier(.62,.03,.3,1);
  --t-curtain:2100ms;
  --fs-logo:clamp(1.55rem,5.1vw,3.5rem);
}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--gold-l)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:999;background:var(--gold);color:#140e04;
  padding:.5rem .9rem;font-weight:600;transition:top .15s}
.skip:focus{top:8px}

/* ---------- the auditorium -------------------------------- */
#house{position:relative;min-height:100%;isolation:isolate}
/* warm house light that dims when the film starts */
#house::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(130% 90% at 50% -10%,rgba(201,162,39,.16),transparent 55%);
  transition:opacity 1.4s ease;
}
body.playing #house::before{opacity:0}

/* ---------- screen behind the curtains -------------------- */
#stage{
  position:fixed;inset:0;z-index:0;
  display:grid;place-items:center;background:#000;
}
#screen{
  position:relative;width:100%;height:100%;
  display:grid;place-items:center;background:#000;
}
#screen video{
  width:100%;height:100%;object-fit:contain;background:#000;
  opacity:0;transition:opacity .9s ease .5s;
}
body.playing #screen video{opacity:1}
/* faint projected glow before the film loads */
#screen::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 18vmin rgba(0,0,0,.85);
}

/* ---------- curtains -------------------------------------- */
#curtains{position:fixed;inset:0;z-index:3;pointer-events:none}
.curtain{
  position:absolute;top:0;bottom:0;width:52%;
  will-change:transform;
  transition:transform var(--t-curtain) var(--curtain-ease);
  background:
    /* a faint second rhythm so the folds are not mechanically even */
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.26) 0 .9%, rgba(0,0,0,0) 2.6%, rgba(255,120,120,.05) 3.9%,
      rgba(0,0,0,0) 5.4%, rgba(0,0,0,.26) 7.3%),
    repeating-linear-gradient(90deg,
      var(--velvet-d) 0 1.3%, var(--velvet) 3.2%, var(--velvet-l) 4.6%,
      var(--velvet) 6.1%, var(--velvet-d) 8.2%),
    linear-gradient(180deg,#4a0a12,#7a1222 38%,#2e050b);
  background-size:13.7% 100%, 8.2% 100%, 100% 100%;
  box-shadow:inset 0 -14vh 22vh rgba(0,0,0,.6), 0 0 6vmin rgba(0,0,0,.8);
}
.curtain.l{left:0;transform:translateX(0);border-right:1px solid rgba(0,0,0,.5)}
.curtain.r{right:0;transform:translateX(0);border-left:1px solid rgba(0,0,0,.5)}
body.open .curtain.l{transform:translateX(-101%)}
body.open .curtain.r{transform:translateX(101%)}
/* valance / pelmet across the top */
#valance{
  position:absolute;left:0;right:0;top:0;height:13vh;min-height:66px;z-index:2;
  background:
    repeating-linear-gradient(90deg,var(--velvet-d) 0 1%,var(--velvet) 2.4%,var(--velvet-l) 3.4%,var(--velvet) 4.6%,var(--velvet-d) 6%),
    linear-gradient(180deg,#8e1420,#4a0a12);
  box-shadow:0 .7vh 2.6vh rgba(0,0,0,.75);
  transition:transform var(--t-curtain) var(--curtain-ease);
}
#valance::after{ /* scalloped gold fringe */
  content:'';position:absolute;left:0;right:0;bottom:-11px;height:14px;
  background:radial-gradient(circle at 10px -2px,var(--gold-l) 0 5px,transparent 6px) repeat-x;
  background-size:20px 14px;opacity:.85;
}
body.open #valance{transform:translateY(-105%)}

/* ---------- the programme board (lobby) ------------------- */
#board{
  position:relative;z-index:5;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14vh,72px) clamp(.9rem,3vw,2.5rem) 5rem;
  transition:opacity .55s ease,transform .55s ease;
}
body.open #board{opacity:0;transform:scale(.97);pointer-events:none}

/* the framed programme board that hangs over the curtain */
#sheet{
  width:100%;max-width:80rem;
  padding:clamp(1.4rem,3.4vw,2.9rem) clamp(1rem,3vw,2.6rem) clamp(1.6rem,3vw,2.4rem);
  background:linear-gradient(180deg,rgba(9,6,8,.94),rgba(6,4,6,.975));
  border:1px solid rgba(201,162,39,.34);
  border-radius:3px;
  box-shadow:0 2.4rem 5rem rgba(0,0,0,.72), 0 0 0 1px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(255,228,160,.09);
}
/* a thin inner gold rule, like a framed lobby card */
#sheet{position:relative}
#sheet::before{
  content:'';position:absolute;inset:7px;border:1px solid rgba(201,162,39,.16);
  border-radius:2px;pointer-events:none;
}

/* marquee */
#marquee{text-align:center;max-width:62rem;margin:0 auto 2.2rem}
#logo{
  font-family:'Limelight',Georgia,serif;font-size:var(--fs-logo);
  letter-spacing:.14em;line-height:1.08;margin:0;
  text-wrap:balance;
  color:var(--cream);
  text-shadow:0 0 .07em rgba(255,221,130,.55),0 0 .4em rgba(201,162,39,.35),0 .05em 0 #000;
}
#bulbs{display:flex;justify-content:center;gap:.55rem;margin:.9rem 0 .6rem}
#bulbs i{
  width:7px;height:7px;border-radius:50%;background:var(--gold-l);
  box-shadow:0 0 6px 2px rgba(237,208,122,.75);
  animation:bulb 1.9s ease-in-out infinite;
}
@keyframes bulb{0%,100%{opacity:.25}50%{opacity:1}}
#tagline{
  font-family:'Playfair Display',Georgia,serif;font-style:italic;
  color:var(--cream-dim);font-size:clamp(.95rem,1.7vw,1.18rem);margin:.2rem 0 0;
}
#count{display:block;margin-top:.55rem;font-size:.84rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);opacity:.9}

/* top controls */
#tools{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.6rem auto 2.4rem;width:100%;max-width:46rem}
.field{position:relative;flex:1 1 17rem;min-width:13rem}
.field input{
  width:100%;padding:.62rem .9rem .62rem 2.2rem;font:inherit;color:var(--cream);
  background:rgba(0,0,0,.45);border:1px solid rgba(201,162,39,.4);border-radius:3px;
}
.field input::placeholder{color:rgba(244,236,224,.45)}
.field svg{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);width:1.05rem;height:1.05rem;opacity:.6}
.btn{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.62rem 1.1rem;border:1px solid var(--gold-d);border-radius:3px;
  background:linear-gradient(180deg,rgba(201,162,39,.2),rgba(201,162,39,.06));
  color:var(--gold-l);letter-spacing:.1em;text-transform:uppercase;font-size:.84rem;font-weight:600;
  transition:background .18s,border-color .18s,transform .12s;white-space:nowrap;
}
.btn:hover{background:linear-gradient(180deg,rgba(201,162,39,.38),rgba(201,162,39,.14));border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--velvet-l),var(--velvet-d));color:var(--cream);border-color:var(--velvet-l)}
.btn.primary:hover{background:linear-gradient(180deg,#c6283a,#5c0c17)}

/* section headings */
.sec{width:100%;max-width:72rem;margin:0 auto 2.1rem}
.sec h2{
  font-family:'Playfair Display',Georgia,serif;font-weight:500;
  font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  margin:0 0 .85rem;display:flex;align-items:center;gap:.9rem;
}
.sec h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,.5),transparent)}

/* genre chips */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  display:inline-flex;align-items:baseline;gap:.5rem;
  padding:.42rem .8rem;border-radius:2px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.13);
  border-left:4px solid var(--c,var(--gold));
  transition:background .16s,transform .12s,border-color .16s;
  text-align:left;
}
.chip:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.chip .n{font-weight:500;font-size:1.02rem}
.chip .q{font-size:.76rem;color:var(--cream-dim);font-variant-numeric:tabular-nums}
.chip .dice{opacity:0;margin-left:.1rem;font-size:.8rem;transition:opacity .16s}
.chip:hover .dice,.chip:focus-visible .dice{opacity:.8}
</style>
